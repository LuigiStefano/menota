<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>MeNota</title>
    <link rel="stylesheet" th:href="@{/css/menota.css}">
</head>
<body>
<main class="pagina">
    <header class="barra">
        <p class="marca">MeNota</p>

        <form th:action="@{/logout}" method="post">
            <button class="secundario" type="submit">Sair</button>
        </form>
    </header>

    <section class="cartao">
        <h1 th:text="${titulo}"></h1>
        <p th:text="${descricao}"></p>
        <p>Conta: <span th:text="${email}"></span></p>
    </section>
</main>
</body>
</html>
