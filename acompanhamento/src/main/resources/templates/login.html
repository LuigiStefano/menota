<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Entrar | MeNota</title>
    <link rel="stylesheet" th:href="@{/css/menota.css}">
</head>
<body>
<main class="acesso">
    <section class="boas-vindas">
        <p class="marca">MeNota</p>
        <h1>Um momento para se perceber.</h1>
        <p>Escreva sobre seu dia, acolha suas experiências
            e acompanhe sua própria história.</p>
    </section>

    <section class="cartao" aria-labelledby="titulo-login">
        <h2 id="titulo-login">Que bom ter você aqui</h2>

        <p class="mensagem erro" role="alert" th:if="${param.error}">
            E-mail ou senha incorretos.
        </p>

        <p class="mensagem" role="status" th:if="${param.logout}">
            Você saiu da sua conta.
        </p>

        <form th:action="@{/login}" method="post">
            <label for="email">E-mail</label>
            <input id="email"
                   name="username"
                   type="email"
                   autocomplete="username"
                   required>

            <label for="senha">Senha</label>
            <input id="senha"
                   name="password"
                   type="password"
                   autocomplete="current-password"
                   required>

            <button type="submit">Entrar</button>
        </form>
    </section>
</main>
</body>
</html>
