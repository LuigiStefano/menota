spring.application.name=MeNota
server.address=127.0.0.1
server.port=${PORT:8080}
server.servlet.session.timeout=30m
server.servlet.session.cookie.name=MENOTA_DIARIO_SESSION
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/menota_diario}
spring.datasource.username=${DB_USER:menota_diario_app}
spring.datasource.password=${DB_PASSWORD}
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.show-sql=false
spring.sql.init.mode=always
spring.sql.init.encoding=UTF-8
spring.thymeleaf.cache=true
spring.mvc.log-request-details=false
server.error.include-message=never
server.error.include-stacktrace=never
server.error.include-binding-errors=never
logging.level.org.hibernate=OFF
logging.level.org.springframework.web=ERROR
diario.key=${DIARIO_KEY}
gemini.api-key=${GEMINI_API_KEY:}
