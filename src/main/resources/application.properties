spring.application.name=MeNota

server.address=127.0.0.1
server.port=8081

spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/menota}
spring.datasource.username=${DB_USERNAME:menota_app}
spring.datasource.password=${DB_PASSWORD}

spring.sql.init.mode=always
spring.sql.init.encoding=UTF-8

spring.thymeleaf.cache=false