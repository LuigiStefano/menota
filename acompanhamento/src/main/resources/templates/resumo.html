<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Resumo do período | MeNota</title>
    <link rel="stylesheet" th:href="@{/css/menota.css}">
</head>
<body>
<main class="pagina">
    <header class="barra">
        <p class="marca">MeNota</p>

        <form th:action="@{/logout}" method="post">
            <button class="secundario" type="submit">Sair</button>
        </form>
    </header>

    <a class="link-botao" th:href="@{/paciente}">
        Voltar para minha agenda
    </a>

    <section class="cartao">
        <h1>Suas palavras, reunidas</h1>
        <p>Escolha o período das anotações que deseja resumir.</p>

        <form class="form-resumo"
              th:action="@{/paciente/resumo}"
              method="post">

            <label for="dias">Período do resumo</label>

            <select id="dias" name="dias">
                <option value="7" th:selected="${dias == 7}">
                    Últimos 7 dias
                </option>
                <option value="30" th:selected="${dias == 30}">
                    Últimos 30 dias
                </option>
            </select>

            <button type="submit">Gerar resumo</button>
        </form>

        <p class="mensagem erro"
           role="alert"
           th:if="${erro}"
           th:text="${erro}"></p>
    </section>

    <section class="cartao resultado-resumo"
             th:if="${resumo != null}">
        <h2>Resumo do período</h2>

        <p>
            De
            <span th:text="${#temporals.format(
                resumo.inicio, 'dd/MM/yyyy'
            )}"></span>
            a
            <span th:text="${#temporals.format(
                resumo.fim, 'dd/MM/yyyy'
            )}"></span>
        </p>

        <p class="relato" th:text="${resumo.texto}"></p>

    </section>
</main>
</body>
</html>
